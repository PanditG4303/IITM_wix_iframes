<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  background:#f8f8f8;
  overflow-x:hidden;
}

.wrapper{
  display:grid;
  grid-template-columns:65% 35%;
  gap:18px;
  padding:18px;
  width:100%;
  min-height:100vh;
}

/* ── PANELS ── */
.panel{
  background:#fff;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
  overflow:hidden;
}

.left{
  padding:18px;
}

.heading{
  margin-bottom:18px;
}

.heading h2{
  font-size:42px;
  color:#7b2d35;
  font-weight:800;
}

.heading p{
  color:#666;
}

/* ── MASONRY GALLERY ── */
.gallery{
  display:grid;
  grid-template-columns: 1.15fr 1fr 0.85fr;
  grid-template-rows: 210px 160px 190px;
  gap:12px;
}

/* Card A – tall portrait, spans 2 rows */
.card-a{ grid-column:1; grid-row:1/3; }
/* Card B – wide landscape, spans 2 cols */
.card-b{ grid-column:2/4; grid-row:1; }
/* Card C – medium */
.card-c{ grid-column:2; grid-row:2; }
/* Card D – small */
.card-d{ grid-column:3; grid-row:2; }
/* Card E – large featured, spans all 3 cols */
.card-e{ grid-column:1/4; grid-row:3; }

.card{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.10);
  cursor:default;
}

.card-inner{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  transition:transform 0.8s cubic-bezier(.25,.46,.45,.94);
}

.card.flipping .card-inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.back{
  transform:rotateY(180deg);
}

/* ── RIGHT PANEL – BULLETIN ── */
.right{
  display:flex;
  flex-direction:column;
  padding:18px;
  height:730px;
}

.bulletin-header{
  flex-shrink:0;
  margin-bottom:12px;
}

.bulletin-header h2{
  font-size:22px;
  color:#7b2d35;
  font-weight:700;
}

.bulletin-divider{
  height:2px;
  background:linear-gradient(to right,#7b2d35,transparent);
  margin-top:8px;
  border-radius:2px;
}

.bulletin-scroll-area{
  flex:1;
  overflow:hidden;
  position:relative;
}

.notice-track{
  animation:scroll 80s linear infinite;
  will-change:transform;
}

.bulletin-scroll-area:hover .notice-track{
  animation-play-state:paused;
}

.notice,
a.notice-link{
  background:#fff;
  border-left:5px solid #7b2d35;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.05);
}

a.notice-link{
  display:block;
  text-decoration:none;
  color:inherit;
}

.notice b{
  display:block;
  color:#222;
  font-size:14px;
  margin-bottom:4px;
}

.notice span{
  color:#888;
  font-size:12px;
}

@keyframes scroll{
  0%  { transform:translateY(0); }
  100%{ transform:translateY(-50%); }
}

/* ── MOBILE ── */
@media(max-width:900px){

  .wrapper{
    grid-template-columns:1fr;
    padding:12px;
    gap:12px;
  }

  /* 2-column compact masonry */
  .gallery{
    grid-template-columns:1fr 1fr;
    grid-template-rows:160px 120px 130px 110px;
    gap:8px;
  }

  .card-a{ grid-column:1;   grid-row:1/3; }
  .card-b{ grid-column:2;   grid-row:1; }
  .card-c{ grid-column:2;   grid-row:2; }
  .card-d{ grid-column:1;   grid-row:3; }
  .card-e{ grid-column:2;   grid-row:3/5; }

  .heading h2{
    font-size:28px;
  }

  .right{
    height:auto;
    min-height:320px;
  }

  .notice-track{
    animation:scroll 60s linear infinite;
  }
}

</style>
</head>
<body>

<div class="wrapper">

  <!-- LEFT: Gallery -->
  <div class="panel left">
    <div class="heading">
      <h2>Campus Highlights</h2>
      <p>Moments &bull; Achievements &bull; Campus Life</p>
    </div>

    <div class="gallery">
      <div class="card card-a" data-slot="0">
        <div class="card-inner">
          <div class="face front"><img src="" alt=""></div>
          <div class="face back"><img src="" alt=""></div>
        </div>
      </div>

      <div class="card card-b" data-slot="1">
        <div class="card-inner">
          <div class="face front"><img src="" alt=""></div>
          <div class="face back"><img src="" alt=""></div>
        </div>
      </div>

      <div class="card card-c" data-slot="2">
        <div class="card-inner">
          <div class="face front"><img src="" alt=""></div>
          <div class="face back"><img src="" alt=""></div>
        </div>
      </div>

      <div class="card card-d" data-slot="3">
        <div class="card-inner">
          <div class="face front"><img src="" alt=""></div>
          <div class="face back"><img src="" alt=""></div>
        </div>
      </div>

      <div class="card card-e" data-slot="4">
        <div class="card-inner">
          <div class="face front"><img src="" alt=""></div>
          <div class="face back"><img src="" alt=""></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Bulletin -->
  <div class="panel right">
    <div class="bulletin-header">
      <h2>Latest Notices</h2>
      <div class="bulletin-divider"></div>
    </div>

    <div class="bulletin-scroll-area">
      <div class="notice-track" id="noticeTrack">
        <!-- JS will populate duplicated notices here -->
      </div>
    </div>
  </div>

</div>

<script>
/* ───────────────────────────────────────────────
   IMAGE POOL MANAGEMENT
   10 images total, 5 cards visible (no duplicates)
─────────────────────────────────────────────── */

const ALL_IMAGES = [
  "https://static.wixstatic.com/media/ab471d_f3531e4beb1b4caeb3e0acb51f8432b1~mv2.png",
  "https://static.wixstatic.com/media/ab471d_ed9b7e5e9dd041b1be82b9f5482f550c~mv2.png",
  "https://static.wixstatic.com/media/ab471d_4f40b1c05ccb474896b0af381602441c~mv2.jpg",
  "https://static.wixstatic.com/media/ab471d_3aca6c1b51bc452cae181076f77b7351~mv2.jpg",
  "https://static.wixstatic.com/media/ab471d_b63916bc8bd74836935ec6288e874acf~mv2.jpg",
  "https://static.wixstatic.com/media/ee3217_f0e91d4f7c5e4d2197390344a1724786~mv2.jpg",
  "https://static.wixstatic.com/media/ee3217_1097767859ac4e28b35e6798e5eaf269~mv2.png",
  "https://static.wixstatic.com/media/ab471d_4bb7e6b240cf47eda3867d346fa5be5d~mv2.jpeg",
  "https://static.wixstatic.com/media/ab471d_4163028683b848f4910f867d28836104~mv2.jpeg",
  "https://static.wixstatic.com/media/ab471d_bff7f62c97e44cca99572884b4037502~mv2.png"
];

// Shuffle helper
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const cards = [...document.querySelectorAll('.card')];
const NUM_CARDS = cards.length; // 5

// displayed[i] = image URL currently on each card's VISIBLE face
// hiddenPool   = images not currently shown
let displayed = [];
let hiddenPool = [];

function init(){
  const shuffled = shuffle(ALL_IMAGES);
  displayed = shuffled.slice(0, NUM_CARDS);
  hiddenPool = shuffled.slice(NUM_CARDS);

  // Each card: front = assigned image, back = blank (will be set before flip)
  cards.forEach((card, i)=>{
    const front = card.querySelector('.front img');
    front.src = displayed[i];
    // track which face is currently showing (false=front, true=back)
    card.dataset.showingBack = "false";
  });
}

/* ───────────────────────────────────────────────
   FLIP LOGIC
   1. Pick random card (not last-flipped)
   2. Pick random image from hidden pool → set on hidden face
   3. Flip card
   4. After animation: update state, return old image to pool
─────────────────────────────────────────────── */

let lastFlipped = -1;
let isAnimating = false;

function doFlip(){
  if(isAnimating) return;

  // Pick a card that wasn't last flipped
  let idx;
  do{ idx = Math.floor(Math.random()*NUM_CARDS); }
  while(idx === lastFlipped && NUM_CARDS > 1);

  lastFlipped = idx;

  const card = cards[idx];
  const showingBack = card.dataset.showingBack === "true";

  // Pick new image from hidden pool
  const poolIdx = Math.floor(Math.random()*hiddenPool.length);
  const newImg  = hiddenPool[poolIdx];
  const oldImg  = displayed[idx];

  // Pre-load new image onto the hidden face
  const hiddenFace = showingBack
    ? card.querySelector('.front img')
    : card.querySelector('.back img');

  hiddenFace.src = newImg;

  // Update state immediately
  hiddenPool[poolIdx] = oldImg;   // old image returns to pool
  displayed[idx] = newImg;

  // Trigger flip
  isAnimating = true;

  if(showingBack){
    card.classList.remove('flipping');          // flip back to front (shows new image on front)
    card.dataset.showingBack = "false";
  } else {
    card.classList.add('flipping');             // flip to back (shows new image on back)
    card.dataset.showingBack = "true";
  }

  setTimeout(()=>{
    isAnimating = false;
    scheduleNext();
  }, 900);
}

function scheduleNext(){
  const delay = 3000 + Math.random() * 3000;   // 3–6 seconds
  setTimeout(doFlip, delay);
}

/* ───────────────────────────────────────────────
   NOTICE BOARD – TRUE INFINITE LOOP
─────────────────────────────────────────────── */

const notices = [
  { title:"FIESTA 2026 Registration",       date:"11 April 2026" },
  { title:"Internal Examination Notice",    date:"23 March 2026" },
  { title:"Industrial Visit – Uniconverge", date:"20 April 2026" },
  { title:"Educational Visit – CSIR",       date:"10 April 2026" },
  { title:"Semester Result Declaration",    date:"5 April 2026"  },
  { title:"Library Closure Notice",         date:"28 March 2026" },
  { title:"Summer Training Notice",         date:"", pdfUrl:"https://ab471de8-5367-47f7-9146-a01672be61b7.usrfiles.com/ugd/ab471d_f880094ca2164d2780d2ee9ba68d595e.pdf" },
  { title:"Guest Lecture Notice",           date:"", pdfUrl:"https://ab471de8-5367-47f7-9146-a01672be61b7.usrfiles.com/ugd/ab471d_f5b0cbc48a554deb9a9d981e2267c577.pdf" },
];

function buildNotices(){
  const track = document.getElementById('noticeTrack');
  // Build two identical lists for seamless loop
  [1,2].forEach(()=>{
    const list = document.createElement('div');
    notices.forEach(n=>{
      let el;
      if (n.pdfUrl) {
        el = document.createElement('a');
        el.href = n.pdfUrl;
        el.target = '_blank';
        el.rel = 'noopener noreferrer';
        el.className = 'notice-link';
      } else {
        el = document.createElement('div');
        el.className = 'notice';
      }
      el.innerHTML = `<b>${n.title}</b><span>${n.date}</span>`;
      list.appendChild(el);
    });
    track.appendChild(list);
  });
}

/* ── BOOT ── */
init();
buildNotices();
setTimeout(doFlip, 2500);
</script>
</body>
</html>
