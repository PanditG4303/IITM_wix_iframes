<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalpana Chawla Chhatravrati Yojna for Girls | IITM College of Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
overflow-x: hidden;
font-family: 'Poppins', sans-serif;
background: #faf7f7;
color: #2d2d2d;
-webkit-font-smoothing: antialiased;
}
:focus-visible {
outline: 3px solid #d4a94f;
outline-offset: 2px;
border-radius: 4px;
}
.scholarship-page {
max-width: 1150px;
margin: 0 auto;
padding: 0;
}
.slim-accent {
height: 4px;
background: linear-gradient(90deg, #7b2d35, #d4a94f, #7b2d35);
}
.scholarship-header {
padding: 24px 24px 14px;
}
.scholarship-header .label {
font-size: 11px;
font-weight: 600;
letter-spacing: 2.5px;
text-transform: uppercase;
color: #7b2d35;
margin-bottom: 6px;
}
.scholarship-header h1 {
font-size: clamp(20px, 2.8vw, 32px);
font-weight: 700;
color: #651421;
margin: 0 0 6px;
line-height: 1.2;
}
.scholarship-header .authority {
font-size: clamp(12px, 1.1vw, 14px);
color: #666;
font-weight: 400;
margin: 0 0 10px;
line-height: 1.5;
}
.scholarship-header .deadline-badge {
display: inline-flex;
align-items: center;
padding: 5px 14px;
font-size: 12px;
font-weight: 600;
color: #fff;
background: #7b2d35;
border-radius: 100px;
}
.poster-section {
padding: 0 24px 32px;
}
.poster-label {
padding: 12px 18px;
background: #faf5f2;
border: 1px solid rgba(123,45,53,0.08);
border-bottom: none;
border-radius: 12px 12px 0 0;
font-size: 13px;
font-weight: 600;
color: #651421;
}
.poster-container {
width: 100%;
padding: clamp(12px, 2vw, 24px);
background: #eee9e9;
border: 1px solid rgba(123,45,53,0.08);
border-radius: 0 0 12px 12px;
box-shadow: 0 4px 30px rgba(123,45,53,0.08);
display: flex;
justify-content: center;
align-items: flex-start;
}
.scholarship-poster {
display: block;
width: 100%;
max-width: 1000px;
height: auto;
object-fit: contain;
margin: 0 auto;
background: #fff;
box-shadow: 0 5px 24px rgba(0,0,0,0.10);
}
.bg-grid {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 0;
background-image:
linear-gradient(rgba(123,45,53,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(123,45,53,0.03) 1px, transparent 1px);
background-size: 60px 60px;
}
@media (max-width: 768px) {
.scholarship-header { padding: 18px 16px 10px; }
.poster-section { padding: 0 10px 20px; }
.poster-container { padding: 8px; }
.scholarship-poster { width: 100%; max-width: none; height: auto; }
}
@media (max-width: 480px) {
.scholarship-header { padding: 14px 10px 8px; }
.poster-section { padding: 0 5px 16px; }
.poster-container { padding: 4px; border-radius: 0 0 8px 8px; }
.poster-label { padding: 10px 12px; border-radius: 8px 8px 0 0; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<div class="slim-accent"></div>

<main class="scholarship-page">
<header class="scholarship-header">
<div class="label">SCHOLARSHIP SCHEME &#8226; 2025-26</div>
<h1>Kalpana Chawla Chhatravrati Yojna for Girls</h1>
<p class="authority">Haryana State Council for Science, Innovation &amp; Technology, Panchkula</p>
<span class="deadline-badge" aria-label="Last date August 10, 2026">Last Date: 10.08.2026</span>
</header>

<section class="poster-section">
<div class="poster-label">Official Scholarship Poster</div>
<div class="poster-container">
<img
src="https://static.wixstatic.com/media/ab471d_5a525da6d119402ba14022bd9863940c~mv2.jpg"
alt="Kalpana Chawla Chhatravrati Yojna for Girls Scholarship Scheme 2025-26"
class="scholarship-poster"
loading="eager"
decoding="async">
</div>
</section>
</main>

</body>
</html>
