<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ICE 2026 – IITM College of Engineering, Bahadurgarh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--maroon:#8b1e2d;
--maroon-dark:#651421;
--gold:#d4a94f;
--bg:#faf7f7;
--white:#ffffff;
--text:#222;
--muted:#666;
--border:#ece8e8;
--radius:30px;
--shadow:0 10px 30px rgba(0,0,0,.08);
--shadow-lg:0 20px 50px rgba(0,0,0,.12);
--transition:0.4s cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
::selection{background:var(--maroon);color:var(--white)}
.container{width:min(1400px,92%);margin:0 auto}
.section{padding:64px 0;position:relative}
.section-tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;position:relative}
.section-tag::before{content:'';display:inline-block;width:24px;height:2px;background:var(--gold);vertical-align:middle;margin-right:10px}
.section-title{font-size:clamp(30px,4vw,48px);color:var(--maroon);font-weight:800;line-height:1.12;margin-bottom:16px}
.section-desc{font-size:16px;color:var(--muted);max-width:620px;line-height:1.7}
.card{background:var(--white);border-radius:var(--radius);padding:32px;border:1px solid var(--border);box-shadow:var(--shadow);transition:var(--transition)}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--maroon);border-radius:8px}
/* ── Decorative Patterns ── */
.deco-corner{position:absolute;width:120px;height:120px;pointer-events:none;z-index:0}
.deco-corner.tl{top:0;left:0;border-top:3px solid var(--gold);border-left:3px solid var(--gold);border-radius:var(--radius) 0 0 0;opacity:.3}
.deco-corner.br{bottom:0;right:0;border-bottom:3px solid var(--maroon);border-right:3px solid var(--maroon);border-radius:0 0 var(--radius) 0;opacity:.15}
.deco-dots{position:absolute;width:80px;height:80px;background-image:radial-gradient(var(--maroon) 1.5px,transparent 1.5px);background-size:12px 12px;opacity:.08;pointer-events:none;z-index:0;border-radius:12px}
.deco-ribbon{position:absolute;width:200px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.15;pointer-events:none;z-index:0;transform:rotate(-12deg)}
.deco-badge{position:absolute;width:70px;height:70px;border-radius:50%;border:2px dashed var(--gold);opacity:.15;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center;font-size:28px}
/* ── Scroll Progress ── */
#scrollProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--maroon));z-index:10000;width:0%;transition:width 50ms linear}
/* ── Hero ── */
.hero{padding:56px 0 40px;background:var(--bg);position:relative;overflow:hidden}
.hero .container{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.hero-left{padding-top:20px}
.hero-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:999px;background:var(--maroon);color:var(--white);font-size:12px;font-weight:600;letter-spacing:.5px;margin-bottom:24px;text-transform:uppercase}
.hero-left h1{font-size:clamp(34px,4.8vw,58px);font-weight:800;color:var(--text);line-height:1.08;margin-bottom:16px;letter-spacing:-.5px}
.hero-left h1 .gold{color:var(--gold)}
.hero-left h1 .maroon{color:var(--maroon)}
.hero-left .subtitle{font-size:18px;color:var(--muted);max-width:480px;line-height:1.7;margin-bottom:6px}
.hero-left .institute{font-size:14px;color:var(--gold);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.hero-right{position:relative}
.hero-collage{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--radius);overflow:visible}
.hero-collage .main-img{width:75%;height:70%;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);position:absolute;top:0;right:0;z-index:2}
.hero-collage .main-img img{width:100%;height:100%;object-fit:cover}
.hero-collage .img-2{width:50%;height:50%;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);position:absolute;bottom:0;left:0;z-index:3;border:4px solid var(--white)}
.hero-collage .img-2 img{width:100%;height:100%;object-fit:cover}
.hero-collage .img-3{width:35%;height:35%;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);position:absolute;top:15%;left:0;z-index:1;border:4px solid var(--white)}
.hero-collage .img-3 img{width:100%;height:100%;object-fit:cover}
.hero-collage .deco-circle{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid var(--gold);opacity:.3;bottom:10%;right:-5%;z-index:0}
.hero-collage .deco-line{position:absolute;width:80px;height:3px;background:var(--gold);opacity:.2;top:5%;left:30%;transform:rotate(-15deg);z-index:0}
.hero-collage .deco-box{position:absolute;width:60px;height:60px;border:2px solid var(--maroon);opacity:.12;border-radius:12px;bottom:0;right:10%;transform:rotate(20deg);z-index:0}
.hero-proceedings-btn{display:inline-flex;align-items:center;padding:12px 28px;background:var(--maroon);color:var(--white);font-size:14px;font-weight:600;border-radius:999px;box-shadow:var(--shadow);transition:var(--transition);margin-top:20px;letter-spacing:.3px;text-align:center;line-height:1.3;cursor:pointer}
.hero-proceedings-btn:hover{background:var(--maroon-dark);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
@media(max-width:1200px){.hero-proceedings-btn{margin-left:auto;margin-right:auto}}
@media(max-width:576px){.hero-proceedings-btn{font-size:13px;padding:10px 20px}}
/* ── Proceedings PDF Viewer ── */
.proceedings-section{background:var(--bg);position:relative;padding:40px 0 64px}
.proceedings-section .container{position:relative;z-index:1}
.proceedings-header{text-align:center;margin-bottom:32px}
.proceedings-tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;position:relative}
.proceedings-tag::before{content:'';display:inline-block;width:24px;height:2px;background:var(--gold);vertical-align:middle;margin-right:10px}
.proceedings-heading{font-size:clamp(24px,3.6vw,42px);color:var(--maroon);font-weight:800;line-height:1.12;margin-bottom:12px}
.proceedings-desc{font-size:15px;color:var(--muted);max-width:600px;margin:0 auto;line-height:1.7}
.proceedings-open-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:var(--maroon);color:var(--white);font-size:13px;font-weight:600;border-radius:999px;box-shadow:var(--shadow);transition:var(--transition);margin-top:16px;letter-spacing:.3px;cursor:pointer}
.proceedings-open-btn:hover{background:var(--maroon-dark);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.proceedings-viewer-card{width:100%;max-width:820px;margin:0 auto;padding:20px;background:rgba(139,30,45,.025);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.proceedings-reader-shell{width:100%;max-width:760px;margin:0 auto;min-width:0}
.proceedings-document-frame{position:relative;width:100%;height:520px;max-width:100%;min-width:0;overflow:hidden;background:#ffffff;border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.proceedings-pdf-iframe{display:block;width:100%;height:100%;max-width:100%;border:0;margin:0;padding:0;background:#ffffff}
@media(max-width:992px){.proceedings-viewer-card{max-width:720px;padding:16px}.proceedings-reader-shell{width:100%;max-width:680px}.proceedings-document-frame{width:100%;height:480px}}
@media(max-width:576px){.proceedings-section{padding:24px 0 40px}.proceedings-section .container{width:92%;max-width:100%;min-width:0}.proceedings-viewer-card{width:100%;max-width:100%;min-width:0;margin:0 auto;padding:6px;border-radius:14px;overflow:hidden}.proceedings-reader-shell{width:100%;max-width:100%;min-width:0;margin:0;overflow:hidden}.proceedings-document-frame{width:100%;max-width:100%;min-width:0;height:420px;overflow:hidden;border-radius:10px}.proceedings-pdf-iframe{display:block;width:100%;max-width:100%;min-width:0;height:100%;border:0}.proceedings-heading{font-size:20px}.proceedings-desc{font-size:13px;padding:0 4px}.proceedings-open-btn{max-width:100%;white-space:normal;text-align:center;justify-content:center;font-size:12px;padding:9px 16px}}
@media(max-width:390px){.proceedings-viewer-card{padding:4px}.proceedings-document-frame{height:360px}.proceedings-heading{font-size:18px}}
/* ── About ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.about-images{position:relative;width:100%;aspect-ratio:4/3}
.about-images .img-main{position:absolute;width:70%;height:75%;top:0;right:0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);z-index:2}
.about-images .img-main img,.about-images .img-sm img{width:100%;height:100%;object-fit:cover}
.about-images .img-sm{position:absolute;width:45%;height:45%;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);z-index:3;border:4px solid var(--white)}
.about-images .img-sm.tl{bottom:10%;left:0}
.about-images .img-sm.br{top:8%;left:5%;z-index:1;border-color:var(--gold)}
.about-images .deco-ring{position:absolute;width:180px;height:180px;border-radius:50%;border:2px solid var(--gold);opacity:.15;bottom:0;right:-8%;z-index:0}
.about-text .college-name{font-size:14px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
/* ── Objectives ── */
.objectives-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:24px}
.obj-card{text-align:center;padding:24px 14px;cursor:default}
.obj-card .obj-icon{font-size:30px;margin-bottom:10px;display:block}
.obj-card h4{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
/* ── Timeline ── */
.timeline-wrap{position:relative;padding:20px 0}
.timeline-bar{position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--maroon));transform:translateX(-50%);border-radius:3px}
.timeline-item{display:grid;grid-template-columns:1fr 1fr;gap:50px;position:relative;padding:24px 0}
.timeline-item:nth-child(even){direction:rtl}
.timeline-item:nth-child(even) .tl-content{direction:ltr}
.timeline-item .tl-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;background:var(--gold);border-radius:50%;border:4px solid var(--bg);z-index:2;box-shadow:0 0 0 3px var(--gold)}
.tl-content{padding:28px;background:var(--white);border-radius:24px;border:1px solid var(--border);box-shadow:var(--shadow);transition:var(--transition)}
.tl-content:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.tl-content .step{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--maroon);color:var(--white);font-weight:700;font-size:14px;margin-bottom:8px}
.tl-content .date{font-size:12px;font-weight:600;color:var(--gold);display:block;margin-bottom:4px;letter-spacing:.3px}
.tl-content h3{font-size:18px;font-weight:600;margin-bottom:4px}
.tl-content p{font-size:13px;color:var(--muted);line-height:1.6}
/* ── Call For Papers ── */
.cfp-accordion{max-width:920px;margin:0 auto}
.cfp-main{border-radius:var(--radius);background:var(--white);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;margin-bottom:28px}
.cfp-header{padding:22px 28px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:var(--transition);font-size:16px;font-weight:600;color:var(--maroon);user-select:none}
.cfp-header:hover{background:rgba(139,30,45,.03)}
.cfp-header .arrow{font-size:14px;color:var(--gold);transition:transform .3s;flex-shrink:0;margin-left:16px}
.cfp-header.active .arrow{transform:rotate(180deg)}
.cfp-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(0.22,1,0.36,1)}
.cfp-body-inner{padding:0 28px 28px}
.cfp-body-inner p{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.cfp-sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:28px}
.cfp-sect{padding:16px;background:rgba(212,169,79,.05);border-radius:16px;border:1px solid rgba(212,169,79,.15)}
.cfp-sect h5{font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:4px}
.cfp-sect p{font-size:12px;color:var(--muted);margin:0}
.themes-grid{display:grid;gap:10px}
.theme-mini{border-radius:16px;background:var(--white);border:1px solid var(--border);overflow:hidden}
.theme-mini-header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:var(--transition);font-size:14px;font-weight:600;color:var(--maroon);user-select:none}
.theme-mini-header:hover{background:rgba(139,30,45,.03)}
.theme-mini-header .arrow{font-size:11px;color:var(--gold);transition:transform .3s;flex-shrink:0;margin-left:12px}
.theme-mini-header.active .arrow{transform:rotate(180deg)}
.theme-mini-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(0.22,1,0.36,1)}
.theme-mini-body-inner{padding:0 20px 16px;display:flex;flex-wrap:wrap;gap:6px}
.theme-mini-body-inner span{padding:5px 12px;background:rgba(139,30,45,.04);border-radius:20px;font-size:12px;color:var(--text)}
/* ── Tracks (expandable) ── */
.tracks-accordion{max-width:920px;margin:0 auto}
.track-expand{border-radius:var(--radius);background:var(--white);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.track-header{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:var(--transition);user-select:none}
.track-header:hover{background:rgba(139,30,45,.03)}
.track-header .left{display:flex;align-items:center;gap:14px}
.track-header .left .icon{font-size:26px;flex-shrink:0}
.track-header .left h4{font-size:15px;font-weight:600;color:var(--text)}
.track-header .arrow{font-size:13px;color:var(--gold);transition:transform .3s;flex-shrink:0;margin-left:12px}
.track-header.active .arrow{transform:rotate(180deg)}
.track-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(0.22,1,0.36,1)}
.track-body-inner{padding:0 24px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.track-body-inner span{padding:8px 14px;background:rgba(139,30,45,.04);border-radius:10px;font-size:13px;color:var(--text);border:1px solid var(--border);text-align:center}
/* ── Committee Accordion ── */
.committee-accordion{max-width:920px;margin:0 auto}
.accordion-group{border-radius:var(--radius);background:var(--white);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.accordion-header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:var(--transition);font-size:15px;font-weight:600;color:var(--maroon);user-select:none}
.accordion-header:hover{background:rgba(139,30,45,.03)}
.accordion-header .arrow{font-size:12px;color:var(--gold);transition:transform .3s;flex-shrink:0;margin-left:12px}
.accordion-header.active .arrow{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(0.22,1,0.36,1)}
.accordion-body-inner{padding:0 24px 24px}
.accordion-body-inner .committee-grid-accordion{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.member-card{text-align:center;padding:0 0 16px;overflow:hidden}
.member-card .photo{width:100%;aspect-ratio:1;overflow:hidden;background:var(--light)}
.member-card .photo img{width:100%;height:100%;object-fit:cover;transition:var(--transition)}
.member-card:hover .photo img{transform:scale(1.05)}
.member-card .info{padding:12px 10px 0}
.member-card .info h4{font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.3}
.member-card .info .role{font-size:10px;color:var(--maroon);font-weight:600;line-height:1.3}
.member-card .info .inst{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
.member-card .info .dept{font-size:10px;color:var(--muted);line-height:1.3}
.member-card .info .country{font-size:10px;color:var(--gold);font-weight:500;margin-top:2px}
/* ── Best Paper Award ── */
.award-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;max-width:760px;margin:0 auto}
.award-card{text-align:center;padding:40px 28px}
.award-card .trophy-mini{font-size:38px;display:block;margin-bottom:12px;filter:drop-shadow(0 6px 16px rgba(212,169,79,.3))}
.award-card .award-photo{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 18px;border:4px solid var(--gold);box-shadow:var(--shadow)}
.award-card .award-photo img{width:100%;height:100%;object-fit:cover}
.award-card h3{font-size:19px;font-weight:700;color:var(--maroon);margin-bottom:8px}
.award-card p.award-desc{font-size:13px;color:var(--muted);line-height:1.7;max-width:280px;margin:0 auto}
@media(max-width:640px){.award-grid{grid-template-columns:1fr;max-width:380px}}
/* ── Gallery (smooth crossfade masonry, no flicker) ── */
.flip-gallery{column-count:4;column-gap:18px}
.flip-cell{display:block;width:100%;margin:0 0 18px;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;background:var(--white);transition:box-shadow .4s}
.flip-cell:hover{box-shadow:var(--shadow-lg)}
.flip-inner{position:relative;width:100%;overflow:hidden;aspect-ratio:1.5}
.flip-face{position:absolute;inset:0;opacity:0;transition:opacity 3s ease;will-change:opacity;backface-visibility:hidden}
.flip-face.is-active{opacity:1}
.flip-face img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:1100px){.flip-gallery{column-count:3}}
@media(max-width:700px){.flip-gallery{column-count:2}}
@media(max-width:430px){.flip-gallery{column-count:1}}
/* ── Lightbox ── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s}
.lightbox.active{opacity:1;pointer-events:all}
.lightbox img{max-width:90vw;max-height:85vh;border-radius:12px;object-fit:contain}
.lightbox-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:var(--white);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.lightbox-close:hover{background:rgba(255,255,255,.2)}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:var(--white);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.lightbox-nav:hover{background:rgba(255,255,255,.2)}
.lightbox-nav.prev{left:16px}
.lightbox-nav.next{right:16px}
/* ── Partners ── */
.partners-wrap{max-width:920px;margin:0 auto}
.partner-group{margin-bottom:36px}
.partner-group:last-child{margin-bottom:0}
.partner-group h4{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:20px;text-align:center}
.partners-logo-grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:16px}
.partner-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;border-radius:24px;background:var(--white);border:1px solid var(--border);box-shadow:var(--shadow);transition:var(--transition);min-height:120px;width:190px;text-align:center}
.partner-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.partner-card img{max-height:48px;width:auto;max-width:100%;margin-bottom:10px;object-fit:contain}
.partner-card span{font-size:11px;color:var(--muted);font-weight:500}
/* ── Footer ── */
footer{background:var(--maroon-dark);color:rgba(255,255,255,.6);border-radius:var(--radius) var(--radius) 0 0;position:relative;padding:28px 0;text-align:center;font-size:13px;line-height:1.7}
footer .brand{font-size:15px;font-weight:700;color:var(--white);margin-bottom:2px}
footer .brand span{color:var(--gold)}
footer .copy{color:rgba(255,255,255,.4);font-size:12px}
/* ── Reveal Animations ── */
.reveal{opacity:0;transform:translateY(30px);transition:all .7s cubic-bezier(0.22,1,0.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ════════════════════════════════════════════════
   UTILITY FUNCTIONS
   ════════════════════════════════════════════════ */
const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => (p || document).querySelectorAll(s);
const mk = (t) => document.createElement(t);

function initText(id, text) {
  const el = $(`#${id}`);
  if (el) el.innerHTML = text;
}

function getPhotoUrl(name, size) {
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=8b1e2d&color=fff&size=${size || 200}`;
}

function shuffleArray(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ════════════════════════════════════════════════
   SCROLL PROGRESS
   ════════════════════════════════════════════════ */
window.addEventListener('scroll', () => {
  const p = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
  $('#scrollProgress').style.width = (p * 100) + '%';
});

/* ════════════════════════════════════════════════
   INTERSECTION OBSERVER
   ════════════════════════════════════════════════ */
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
}, { threshold: .15, rootMargin: '0px 0px -40px 0px' });

function observe(el) {
  if (el) io.observe(el);
}

/* ════════════════════════════════════════════════
   RENDER: ABOUT + OBJECTIVES
   ════════════════════════════════════════════════ */
function renderAbout() {
  const c = DATA.conferenceInfo;
  initText('aboutTag', c.aboutTag);
  initText('aboutCollege', c.aboutCollege);
  initText('aboutTitle', c.aboutTitle);
  const desc = $('#aboutDesc');
  if (desc) {
    desc.innerHTML = c.aboutParagraphs.map(p => `<p class="section-desc" style="margin-bottom:14px">${p}</p>`).join('');
  }
  const imgs = DATA.aboutImages;
  if ($('#aboutImg1')) $('#aboutImg1').src = imgs.image1;
  if ($('#aboutImg2')) $('#aboutImg2').src = imgs.image2;
  if ($('#aboutImg3')) $('#aboutImg3').src = imgs.image3;
  // Objectives
  initText('objTitle', c.objectivesTitle);
  initText('objDesc', c.objectivesDesc);
  const og = $('#objectivesGrid');
  if (og) {
    c.objectives.forEach(o => {
      const card = mk('div'); card.className = 'obj-card card reveal';
      card.style.padding = '20px 12px';
      card.innerHTML = `<span class="obj-icon">${o.icon}</span><h4>${o.title}</h4>`;
      og.appendChild(card);
      observe(card);
    });
  }
  observe($('#objectivesCard'));
}

   RENDER: TIMELINE
   ════════════════════════════════════════════════ */
function renderTimeline() {
  const t = DATA.timeline;
  initText('tlTag', t.tag);
  initText('tlTitle', t.title);
  initText('tlDesc', t.desc);
  const wrap = $('#timelineWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="timeline-bar"></div>';
  t.items.forEach((item, idx) => {
    const el = mk('div'); el.className = 'timeline-item reveal';
    el.style.setProperty('--idx', idx);
    el.innerHTML = `<div></div>
      <div class="tl-content">
        <div class="step">${item.step}</div>
        <span class="date">${item.date}</span>
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </div>
      <div class="tl-dot"></div>`;
    wrap.appendChild(el);
    observe(el);
  });
}

/* ════════════════════════════════════════════════
   RENDER: CALL FOR PAPERS
   ════════════════════════════════════════════════ */
function renderCallForPapers() {
  const c = DATA.callForPapers;
  initText('cfpTag', c.tag);
  initText('cfpTitle', c.title);
  initText('cfpDesc', c.desc);
  const acc = $('#cfpAccordion');
  if (!acc) return;

  const main = mk('div'); main.className = 'cfp-main reveal';
  main.innerHTML = `<div class="cfp-header"><span>Call For Papers</span><span class="arrow">▼</span></div>
    <div class="cfp-body"><div class="cfp-body-inner"></div></div>`;
  const inner = main.querySelector('.cfp-body-inner');
  const grid = mk('div'); grid.className = 'cfp-sections';
  c.sections.forEach(s => {
    const sect = mk('div'); sect.className = 'cfp-sect';
    sect.innerHTML = `<h5>${s.title}</h5><p>${s.text}</p>`;
    grid.appendChild(sect);
  });
  inner.appendChild(grid);
  const th = mk('h5'); th.style.cssText = 'font-size:15px;font-weight:600;color:var(--maroon);margin-bottom:12px';
  th.textContent = 'Conference Themes';
  inner.appendChild(th);
  const tg = mk('div'); tg.className = 'themes-grid';
  c.themes.forEach(thm => {
    const mc = mk('div'); mc.className = 'theme-mini';
    mc.innerHTML = `<div class="theme-mini-header"><span>${thm.name}</span><span class="arrow">▼</span></div>
      <div class="theme-mini-body"><div class="theme-mini-body-inner"></div></div>`;
    const bi = mc.querySelector('.theme-mini-body-inner');
    thm.topics.forEach(tp => {
      const sp = mk('span'); sp.textContent = tp;
      bi.appendChild(sp);
    });
    tg.appendChild(mc);
  });
  inner.appendChild(tg);
  acc.appendChild(main);
  observe(main);

  main.querySelector('.cfp-header').addEventListener('click', function() {
    const body = this.nextElementSibling;
    if (body.style.maxHeight) {
      body.style.maxHeight = null;
      this.classList.remove('active');
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      this.classList.add('active');
    }
  });

  acc.querySelectorAll('.theme-mini-header').forEach(h => {
    h.addEventListener('click', function() {
      const body = this.nextElementSibling;
      if (body.style.maxHeight) {
        body.style.maxHeight = null;
        this.classList.remove('active');
      } else {
        body.style.maxHeight = body.scrollHeight + 'px';
        this.classList.add('active');
      }
    });
  });
}

function renderCommittee() {
  const c = DATA;
  initText('committeeTag', 'Organizers');
  initText('committeeTitle', 'Committee Structure');
  initText('committeeDesc', 'Distinguished professionals leading the conference');
  const acc = $('#committeeAccordion');
  if (!acc) return;
  c.committee.forEach(group => {
    const el = mk('div'); el.className = 'accordion-group reveal';
    el.innerHTML = `<div class="accordion-header"><span>${group.group}</span><span class="arrow">▼</span></div>
      <div class="accordion-body"><div class="accordion-body-inner"><div class="committee-grid-accordion"></div></div></div>`;
    const grid = el.querySelector('.committee-grid-accordion');
    group.members.forEach(m => {
      const card = mk('div'); card.className = 'member-card';
      const photo = m.photo || getPhotoUrl(m.name, 200);
      card.innerHTML = `<div class="photo"><img src="${photo}" alt="${m.name}" loading="lazy"></div>
        <div class="info">
          <h4>${m.name}</h4>
          <div class="role">${group.badge}</div>
          ${m.designation ? `<div class="dept">${m.designation}</div>` : ''}
          ${m.institution ? `<div class="inst">${m.institution}</div>` : ''}
        </div>`;
      grid.appendChild(card);
    });
    acc.appendChild(el);
    observe(el);

    el.querySelector('.accordion-header').addEventListener('click', function() {
      const body = this.nextElementSibling;
      if (body.style.maxHeight) {
        body.style.maxHeight = null;
        this.classList.remove('active');
      } else {
        body.style.maxHeight = body.scrollHeight + 'px';
        this.classList.add('active');
      }
    });
  });
}

   ════════════════════════════════════════════════ */
function renderPartners() {
  const p = DATA.partners;
  initText('partnersTag', p.tag);
  initText('partnersTitle', p.title);
  const wrap = $('#partnersWrap');
  if (!wrap) return;

  function createGroup(title, items) {
    const g = mk('div'); g.className = 'partner-group reveal';
    g.innerHTML = `<h4>${title}</h4><div class="partners-logo-grid"></div>`;
    const grid = g.querySelector('.partners-logo-grid');
    items.forEach(item => {
      const card = mk('a'); card.className = 'partner-card';
      card.href = item.website || '#';
      card.target = '_blank';
      card.rel = 'noopener';
      card.innerHTML = `<img src="${item.logo}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'"><span>${item.name}</span>`;
      grid.appendChild(card);
    });
    wrap.appendChild(g);
    observe(g);
  }

  createGroup('Technical Partners', p.technical);
  createGroup('Industrial Partners', p.industrial);
}

/* ════════════════════════════════════════════════
   RENDER: GALLERY — smooth crossfade masonry, NO flicker.
   How it avoids the old flicker:
   - The card's aspect-ratio is locked ONCE (from the first image)
     and never changes mid-rotation, so there is no reflow/jolt.
   - Each photo gets its own absolutely-positioned layer that just
     fades opacity in/out (no 3D flip, no layout shift).
   - Only one layer is ever "is-active" at a time and transitions
     are pure opacity, which the browser can animate smoothly.
   - Each cell is preloaded before it's swapped in, so there's never
     a blank/empty frame.
   ════════════════════════════════════════════════ */
function initGalleryText() {
  initText('galleryTag', 'Moments');
  initText('galleryTitle', 'Conference Gallery');
  initText('galleryDesc', 'A living mosaic of moments from past editions');
}

let lightboxIdx = -1;

function openLightboxByIndex(idx) {
  if (idx < 0 || idx >= DATA.gallery.length) return;
  lightboxIdx = idx;
  $('#lbImg').src = DATA.gallery[idx];
  $('#lbImg').alt = 'Conference gallery image';
  $('#lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  $('#lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  let idx = lightboxIdx + dir;
  if (idx < 0) idx = DATA.gallery.length - 1;
  if (idx >= DATA.gallery.length) idx = 0;
  openLightboxByIndex(idx);
}

$('#lbClose').addEventListener('click', closeLightbox);
$('#lbPrev').addEventListener('click', () => navLightbox(-1));
$('#lbNext').addEventListener('click', () => navLightbox(1));
$('#lightbox').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (!$('#lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

function initGallery() {
  const container = $('#galleryMasonry');
  if (!container) return;
  container.innerHTML = '';

  const images = DATA.gallery;
  if (!images.length) return;

  const cellCount = Math.max(4, Math.min(10, Math.ceil(images.length / 2)));
  const pools = Array.from({ length: cellCount }, () => []);
  shuffleArray(images).forEach((img, i) => pools[i % cellCount].push(img));
  pools.forEach(pool => { if (pool.length < 2) pool.push(pool[0]); });

  pools.forEach(pool => {
    const cell = mk('div'); cell.className = 'flip-cell reveal-scale';
    const inner = mk('div'); inner.className = 'flip-inner';
    cell.appendChild(inner);
    container.appendChild(cell);
    observe(cell);

    const faces = pool.map((src) => {
      const face = mk('div'); face.className = 'flip-face';
      const img = mk('img'); img.loading = 'lazy'; img.alt = 'Conference moment';
      face.appendChild(img);
      inner.appendChild(face);
      return { face, img, src, loaded: false };
    });

    let activeIdx = 0;

    function lockRatio(imgEl) {
      if (imgEl.naturalWidth && imgEl.naturalHeight) {
        inner.style.aspectRatio = (imgEl.naturalWidth / imgEl.naturalHeight).toFixed(4);
      }
    }

    function loadFace(f, onReady) {
      if (f.loaded) { onReady(); return; }
      f.img.onload = () => { f.loaded = true; onReady(); };
      f.img.src = f.src;
    }

    loadFace(faces[0], () => {
      lockRatio(faces[0].img);
      faces[0].face.classList.add('is-active');
      const preload = faces[1 % faces.length];
      if (preload) loadFace(preload, () => {});
    });

    function scheduleRotation() {
      const pause = 6000 + Math.random() * 4000;
      setTimeout(() => {
        let nextIdx;
        do {
          nextIdx = Math.floor(Math.random() * faces.length);
        } while (nextIdx === activeIdx);

        loadFace(faces[nextIdx], () => {
          faces[activeIdx].face.classList.remove('is-active');
          faces[nextIdx].face.classList.add('is-active');
          activeIdx = nextIdx;
          let preloadIdx;
          do {
            preloadIdx = Math.floor(Math.random() * faces.length);
          } while (preloadIdx === activeIdx);
          loadFace(faces[preloadIdx], () => {});
          scheduleRotation();
        });
      }, pause);
    }
    scheduleRotation();

    cell.addEventListener('click', () => {
      const idx = DATA.gallery.indexOf(faces[activeIdx].src);
      openLightboxByIndex(idx === -1 ? 0 : idx);
    });
  });
}

/* ════════════════════════════════════════════════
   SMOOTH SCROLL
   ════════════════════════════════════════════════ */
$$('a[href^="#"]').forEach(a => {
  a.addEventListener('click', (e) => {
    const id = a.getAttribute('href');
    if (id === '#') return;
    const target = $(id);
    if (target) {
      e.preventDefault();
      const offset = 80;
      const top = target.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  });
});

document.addEventListener('DOMContentLoaded', () => {
  renderHero();

  initGalleryText();

  $$('.reveal, .reveal-scale').forEach(el => observe(el));
});
